《电力经济学十讲》是一门系统讲授电力市场经济原理与制度实践的专业课程，面向电力政策研究者、能源行业从业者及对电力体制感兴趣的学生。课程分为**“基础内容模块”与“专题模块”**两部分，共十讲，涵盖电力商品属性、市场机制设计、交易方式与监管逻辑，并结合新能源发展、电力零售、数据算法等前沿议题，构建完整的电力经济学分析框架。

通过深入剖析电改背景、市场结构设计、合约与现货互动、市场参与策略及数据驱动方法，课程将帮助学习者理解电力市场的运行逻辑，掌握价格形成机制与监管原理，提升策略建模与实践应用能力。
